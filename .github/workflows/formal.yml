name: Formal checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  finite-models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run finite-model regression tests
        run: python3 -m unittest discover -s formal/finite -p 'test_*.py' -v
      - name: Run finite-model summary
        run: python3 formal/finite/checker.py

  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal/lean
          build: true
          test: false
          leanchecker: true
